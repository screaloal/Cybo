<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Vertical line full -->
  <line x1="100" y1="4" x2="100" y2="196" stroke="rgba(96,165,250,0.2)" stroke-width="0.6"/>

  <!-- Horizontal line full -->
  <line x1="4" y1="100" x2="196" y2="100" stroke="rgba(96,165,250,0.2)" stroke-width="0.6"/>

  <!-- Top arrow outer -->
  <polyline points="86,36 100,12 114,36"
    stroke="rgba(96,165,250,0.7)" stroke-width="1.4"
    fill="none" stroke-linejoin="miter"
    filter="url(#softglow)"/>

  <!-- Top arrow inner -->
  <polyline points="91,42 100,22 109,42"
    stroke="rgba(96,165,250,0.35)" stroke-width="0.8"
    fill="none" stroke-linejoin="miter"/>

  <!-- Bottom arrow outer -->
  <polyline points="86,164 100,188 114,164"
    stroke="rgba(96,165,250,0.7)" stroke-width="1.4"
    fill="none" stroke-linejoin="miter"
    filter="url(#softglow)"/>

  <!-- Bottom arrow inner -->
  <polyline points="91,158 100,178 109,158"
    stroke="rgba(96,165,250,0.35)" stroke-width="0.8"
    fill="none" stroke-linejoin="miter"/>

  <!-- End dots -->
  <circle cx="4" cy="100" r="2" fill="rgba(96,165,250,0.8)" filter="url(#softglow)"/>
  <circle cx="196" cy="100" r="2" fill="rgba(96,165,250,0.8)" filter="url(#softglow)"/>
  <circle cx="100" cy="4" r="2" fill="rgba(96,165,250,0.8)" filter="url(#softglow)"/>
  <circle cx="100" cy="196" r="2" fill="rgba(96,165,250,0.8)" filter="url(#softglow)"/>

  <!-- Outer C arc — large, bold -->
  <path d="M152,65 A60,60 0 1,0 152,135"
    stroke="rgba(96,165,250,0.75)" stroke-width="2.5"
    stroke-linecap="round"
    filter="url(#glow)"/>

  <!-- Inner C arc -->
  <path d="M136,78 A38,38 0 1,0 136,122"
    stroke="rgba(96,165,250,0.45)" stroke-width="1.6"
    stroke-linecap="round"
    filter="url(#softglow)"/>

  <!-- E vertical bar -->
  <line x1="62" y1="76" x2="62" y2="124"
    stroke="rgba(96,165,250,0.75)" stroke-width="2.5"
    stroke-linecap="round"
    filter="url(#softglow)"/>

  <!-- E top bar -->
  <line x1="62" y1="76" x2="118" y2="76"
    stroke="rgba(96,165,250,0.75)" stroke-width="2.5"
    stroke-linecap="round"
    filter="url(#softglow)"/>

  <!-- E middle bar — full width through center -->
  <line x1="62" y1="100" x2="136" y2="100"
    stroke="rgba(96,165,250,0.85)" stroke-width="2.5"
    stroke-linecap="round"
    filter="url(#glow)"/>

  <!-- E bottom bar -->
  <line x1="62" y1="124" x2="118" y2="124"
    stroke="rgba(96,165,250,0.75)" stroke-width="2.5"
    stroke-linecap="round"
    filter="url(#softglow)"/>
</svg>
