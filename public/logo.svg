<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Vertical line -->
  <line x1="100" y1="8" x2="100" y2="192" stroke="rgba(96,165,250,0.35)" stroke-width="0.8"/>

  <!-- Horizontal line -->
  <line x1="8" y1="100" x2="192" y2="100" stroke="rgba(96,165,250,0.35)" stroke-width="0.8"/>

  <!-- Top arrow -->
  <polyline points="88,30 100,14 112,30" stroke="rgba(96,165,250,0.6)" stroke-width="1" fill="none" stroke-linejoin="round"/>
  <polyline points="92,38 100,24 108,38" stroke="rgba(96,165,250,0.3)" stroke-width="0.8" fill="none" stroke-linejoin="round"/>

  <!-- Bottom arrow -->
  <polyline points="88,170 100,186 112,170" stroke="rgba(96,165,250,0.6)" stroke-width="1" fill="none" stroke-linejoin="round"/>
  <polyline points="92,162 100,176 108,162" stroke="rgba(96,165,250,0.3)" stroke-width="0.8" fill="none" stroke-linejoin="round"/>

  <!-- Corner dots -->
  <circle cx="8" cy="100" r="1.5" fill="rgba(96,165,250,0.7)"/>
  <circle cx="192" cy="100" r="1.5" fill="rgba(96,165,250,0.7)"/>
  <circle cx="100" cy="8" r="1.5" fill="rgba(96,165,250,0.7)"/>
  <circle cx="100" cy="192" r="1.5" fill="rgba(96,165,250,0.7)"/>

  <!-- Outer C ring -->
  <path d="M148,72 A56,56 0 1,0 148,128" stroke="rgba(96,165,250,0.55)" stroke-width="1.8" filter="url(#glow)"/>

  <!-- Inner C -->
  <path d="M132,82 A34,34 0 1,0 132,118" stroke="rgba(96,165,250,0.4)" stroke-width="1.4"/>

  <!-- E crossbars -->
  <line x1="66" y1="100" x2="130" y2="100" stroke="rgba(96,165,250,0.55)" stroke-width="1.6" filter="url(#glow)"/>
  <line x1="66" y1="82" x2="110" y2="82" stroke="rgba(96,165,250,0.4)" stroke-width="1.2"/>
  <line x1="66" y1="118" x2="110" y2="118" stroke="rgba(96,165,250,0.4)" stroke-width="1.2"/>
  <line x1="66" y1="82" x2="66" y2="118" stroke="rgba(96,165,250,0.4)" stroke-width="1.2"/>
</svg>
